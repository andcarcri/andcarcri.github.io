<script>
// 1. Ponemos el cronómetro
setTimeout(function() {
    console.log("Han pasado 2 segundos, lanzando petición...");

    // 2. Realizamos el fetch dentro del setTimeout
    fetch('https://jsonplaceholder.typicode.com/posts/1') 
        .then(function(response) {
            return response.json(); // Convertimos la respuesta 
        })
        .then(function(data) {
            console.log("Datos recibidos:", data); 
        })
        .catch(function(error) {
            console.error("Error en la petición:", error); 
        });

}, 2000); // 2000 milisegundos = 2 segundos

// para que el mensaje que utiliza setTimeout se borra cuando pasen los segundos
boton.addEventListener("click", function() {
    
    fetch('https://jsonplaceholder.typicode.com/posts/1') 
        .then(response => response.json())
        .then(data => {
            // Escribimos el resultado en el DOM
            mensaje.textContent = "¡Datos cargados: " + data.title + "!";
            
            // Usamos setTimeout para que el mensaje se borre solo tras 3 segundos
            setTimeout(function() {
                mensaje.textContent = "";
            }, 3000); 
        });
});
</script>
